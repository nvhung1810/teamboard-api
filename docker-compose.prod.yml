# Production: runs a pre-built, versioned image (never builds on the server). DB is NOT exposed.
name: teamboard-prod

services:
  db:
    restart: always
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
  api:
    image: ${API_IMAGE:?set API_IMAGE (e.g. ghcr.io/you/teamboard-api:1.0.0)}
    restart: always
    logging: *logging
    environment:
      NODE_ENV: production
    ports:
      - "${API_PORT:-80}:8080"
    deploy:
      resources:
        limits:
          memory: 512m
